name: EPG Global Unificado e Inteligente

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  generar-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (Para iptv-org)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Descargar fuente LATAM usando iptv-org (Excluyendo open-epg.com)
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg-temp
          cd epg-temp
          npm install
          # Ajusta aquí los sitios de iptv-org que necesitas (sin open-epg.com)
          npm run grab --- --sites="gatotv.com,mi.tv" --output=../latam.xml
          cd ..
          rm -rf epg-temp

      - name: Ejecutar script de fusión inteligente en Python
        run: |
          python merge_epg.py

      - name: Comprimir resultados a .gz independientes
        run: |
          # Archivo 1: EPG de iptv-org
          gzip -c latam.xml > epg-elgato.xml.gz
          
          # Archivo 2: EPG unificado de ferteque / strong8k
          gzip -c strong8k.xml > strong8k.xml.gz
          
          # Limpieza de archivos XML intermedios
          rm -f latam.xml strong8k.xml guia_final_unificada.xml

      - name: Guardar y subir archivos EPG al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Bot] Actualización EPG: strong8k.xml.gz y epg-elgato.xml.gz actualizados"
          file_pattern: "epg-elgato.xml.gz strong8k.xml.gz"
