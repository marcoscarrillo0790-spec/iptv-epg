name: EPG Multiflujo Global Unificado (Paralelo)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # TRABAJO 1: DESCARGAR REGIONES EN PARALELO
  # -------------------------------------------------------------
  descargar-regiones:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: latam
            sites: "gatotv.com,mi.tv,movistarplus.es,orangetv.orange.es,programacion-tv.elpais.com"
          - id: usa
            sites: "tvguide.com,tvhebdo.com"
          - id: uk
            sites: "sky.com"

    steps:
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del sistema EPG
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg-temp
          cd epg-temp
          npm install

      - name: Descargar fuente ${{ matrix.id }}
        run: |
          cd epg-temp
          npm run grab --- --sites=${{ matrix.sites }} --output=${{ matrix.id }}.xml

      - name: Guardar archivo XML como artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: epg-${{ matrix.id }}
          path: epg-temp/${{ matrix.id }}.xml
          retention-days: 1

  # -------------------------------------------------------------
  # TRABAJO 2: UNIFICAR, COMPRIMIR Y SUBIR AL REPOSITORIO
  # -------------------------------------------------------------
  unificar-y-subir:
    needs: descargar-regiones
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar todos los XML generados en paralelo
        uses: actions/download-artifact@v4
        with:
          pattern: epg-*
          merge-multiple: true

      - name: Unir regiones en un solo archivo XML
        run: |
          node -e '
            const fs = require("fs");
            let channels = new Set();
            let allProgrammes = [];
            
            ["latam.xml", "usa.xml", "uk.xml"].forEach(file => {
              if (fs.existsSync(file)) {
                let content = fs.readFileSync(file, "utf8");
                
                let chanMatches = content.match(/<channel id=[\s\S]*?<\/channel>/g);
                if (chanMatches) chanMatches.forEach(c => channels.add(c));
                
                let progMatches = content.match(/<programme[\s\S]*?<\/programme>/g);
                if (progMatches) allProgrammes.push(...progMatches);
              }
            });

            fs.writeFileSync("guide.xml", "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<tv>\n");
            for (let chan of channels) {
              fs.appendFileSync("guide.xml", chan + "\n");
            }
            for (let prog of allProgrammes) {
              fs.appendFileSync("guide.xml", prog + "\n");
            }
            fs.appendFileSync("guide.xml", "</tv>");
          '
          gzip -c guide.xml > epg-elgato.xml.gz
          rm guide.xml

      - name: Guardar y subir epg-elgato.xml.gz al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Bot] Actualización automática de EPG unificado (Paralelo)"
          file_pattern: "epg-elgato.xml.gz"
