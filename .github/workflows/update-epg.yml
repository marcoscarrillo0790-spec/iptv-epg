name: EPG Multiflujo Global Unificado (Inteligente y Prioritario)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # TRABAJO 1: DESCARGAR LATAM MEDIANTE IPTV-ORG
  # -------------------------------------------------------------
  descargar-regiones:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: latam
            sites: "gatotv.com,mi.tv"

    steps:
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del sistema EPG
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg-temp
          cd epg-temp
          npm install

      - name: Descargar fuente ${{ matrix.id }}
        run: |
          cd epg-temp
          npm run grab --- --sites=${{ matrix.sites }} --output=${{ matrix.id }}.xml

      - name: Guardar archivo XML como artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: epg-${{ matrix.id }}
          path: epg-temp/${{ matrix.id }}.xml
          retention-days: 1

  # -------------------------------------------------------------
  # TRABAJO 2: EJECUTAR SCRIPT INTELIGENTE DE PYTHON Y SUBIR
  # -------------------------------------------------------------
  unificar-y-subir:
    needs: descargar-regiones
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permisos de escritura para el bot

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python (si usas requests, etc.)
        run: |
          pip install requests

      - name: Descargar regiones propias generadas (latam.xml)
        uses: actions/download-artifact@v4
        with:
          pattern: epg-*
          merge-multiple: true

      - name: Ejecutar script de fusión inteligente en Python
        run: |
          python merge_epg.py

      - name: Guardar y subir epg-elgato.xml.gz al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Bot] Actualización EPG unificado inteligente (LATAM + Open-EPG + Strong 8K)"
          file_pattern: "epg-elgato.xml.gz"
