unificar-y-subir:
    needs: descargar-regiones
    runs-on: ubuntu-latest
    permissions:
      contents: write  # <-- Esto otorga permiso de escritura al flujo

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar regiones propias generadas
        uses: actions/download-artifact@v4
        with:
          pattern: epg-*
          merge-multiple: true

      - name: Descargar y descomprimir listas EPG externas (Strong 8K / Ferteque)
        run: |
          curl -L "https://github.com/ferteque/Curated-M3U-Repository/raw/refs/heads/main/epg2.xml.gz" -o epg2.xml.gz
          curl -L "https://github.com/ferteque/Curated-M3U-Repository/raw/refs/heads/main/epg1.xml.gz" -o epg1.xml.gz
          curl -L "https://github.com/ferteque/Curated-M3U-Repository/raw/refs/heads/main/epg6.xml.gz" -o epg6.xml.gz
          curl -L "https://github.com/ferteque/Curated-M3U-Repository/raw/refs/heads/main/epg14.xml.gz" -o epg14.xml.gz
          curl -L "https://github.com/ferteque/Curated-M3U-Repository/raw/refs/heads/main/epg52.xml.gz" -o epg52.xml.gz
          curl -L "https://github.com/ferteque/Curated-M3U-Repository/raw/refs/heads/main/epg42.xml.gz" -o epg42.xml.gz
          curl -L "https://github.com/ferteque/Curated-M3U-Repository/raw/refs/heads/main/epg38.xml.gz" -o epg38.xml.gz

          for f in *.gz; do
            gunzip -f "$f"
          done

      - name: Unir y homologar todas las regiones en un solo archivo XML
        run: |
          node -e '
            const fs = require("fs");
            let channels = new Set();
            
            const archivos = [
              "latam.xml", 
              "epg2.xml", "epg1.xml", "epg6.xml", 
              "epg14.xml", "epg52.xml", "epg42.xml", "epg38.xml"
            ];
            
            fs.writeFileSync("guide.xml", "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<tv>\n");

            archivos.forEach(file => {
              if (fs.existsSync(file)) {
                let content = fs.readFileSync(file, "utf8");
                let chanMatches = content.match(/<channel id=[\s\S]*?<\/channel>/g);
                if (chanMatches) {
                  chanMatches.forEach(c => channels.add(c));
                }
              }
            });

            for (let chan of channels) {
              fs.appendFileSync("guide.xml", chan + "\n");
            }

            archivos.forEach(file => {
              if (fs.existsSync(file)) {
                console.log("Procesando programas de: " + file);
                let content = fs.readFileSync(file, "utf8");
                let progMatches = content.match(/<programme[\s\S]*?<\/programme>/g);
                if (progMatches) {
                  for (let i = 0; i < progMatches.length; i++) {
                    fs.appendFileSync("guide.xml", progMatches[i] + "\n");
                  }
                }
              }
            });

            fs.appendFileSync("guide.xml", "</tv>");
          '
          gzip -c guide.xml > epg-elgato.xml.gz
          rm -f guide.xml *.xml

      - name: Guardar y subir epg-elgato.xml.gz al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Bot] Actualización EPG unificado y homologado sin desborde"
          file_pattern: "epg-elgato.xml.gz"
