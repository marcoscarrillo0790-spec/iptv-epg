name: EPG Multiflujo Global Unificado

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del sistema EPG
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg-temp
          cd epg-temp
          npm install

      - name: Bloque 1 - Descargar región LATAM y España (filtrada)
        run: |
          cd epg-temp
          npm run grab --- --sites=gatotv.com,mi.tv,movistarplus.es,orangetv.orange.es,programacion-tv.elpais.com --output=latam.xml

      - name: Bloque 2 - Descargar región USA y Canadá (filtrada)
        run: |
          cd epg-temp
          npm run grab --- --sites=tvguide.com,tvhebdo.com --output=usa.xml

      - name: Bloque 3 - Descargar región UK (filtrada)
        run: |
          cd epg-temp
          npm run grab --- --sites=sky.com --output=uk.xml

      - name: Bloque 4 - Unir regiones y generar epg-elgato.xml.gz
        run: |
          cd epg-temp
          # Script seguro en Node.js que evita desbordar la pila de memoria al fusionar
          node -e '
            const fs = require("fs");
            let channels = new Set();
            let allProgrammes = [];
            
            ["latam.xml", "usa.xml", "uk.xml"].forEach(file => {
              if (fs.existsSync(file)) {
                let content = fs.readFileSync(file, "utf8");
                
                // Extraer y almacenar canales únicos
                let chanMatches = content.match(/<channel id=[\s\S]*?<\/channel>/g);
                if (chanMatches) {
                  chanMatches.forEach(c => channels.add(c));
                }
                
                // Extraer bloques de programas de forma segura por bloques
                let progMatches = content.match(/<programme[\s\S]*?<\/programme>/g);
                if (progMatches) {
                  allProgrammes.push(...progMatches);
                }
              }
            });

            // Escribir el archivo XML unificado por partes para evitar errores de memoria
            fs.writeFileSync("guide.xml", "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<tv>\n");
            for (let chan of channels) {
              fs.appendFileSync("guide.xml", chan + "\n");
            }
            for (let prog of allProgrammes) {
              fs.appendFileSync("guide.xml", prog + "\n");
            }
            fs.appendFileSync("guide.xml", "</tv>");
          '
          # Comprimir y mover a la raíz del repositorio
          gzip -c guide.xml > ../epg-elgato.xml.gz

      - name: Guardar y subir cambios al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Bot] Actualización EPG multiflujo optimizado sin desborde"
          file_pattern: "epg-elgato.xml.gz"
