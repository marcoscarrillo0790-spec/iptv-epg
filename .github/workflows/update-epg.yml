name: EPG Multiflujo Global Unificado (Solo LATAM)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # TRABAJO 1: DESCARGAR LATAM EN PARALELO / DIRECTO
  # -------------------------------------------------------------
  descargar-regiones:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: latam
            sites: "gatotv.com,mi.tv"

    steps:
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del sistema EPG
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg-temp
          cd epg-temp
          npm install

      - name: Descargar fuente ${{ matrix.id }}
        run: |
          cd epg-temp
          npm run grab --- --sites=${{ matrix.sites }} --output=${{ matrix.id }}.xml

      - name: Guardar archivo XML como artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: epg-${{ matrix.id }}
          path: epg-temp/${{ matrix.id }}.xml
          retention-days: 1

  # -------------------------------------------------------------
  # TRABAJO 2: UNIFICAR, HOMOLOGAR, COMPRIMIR Y SUBIR AL REPOSITORIO
  # -------------------------------------------------------------
  unificar-y-subir:
    needs: descargar-regiones
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Otorga permisos de escritura para que el bot pueda hacer el push

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar regiones propias generadas
        uses: actions/download-artifact@v4
        with:
          pattern: epg-*
          merge-multiple: true

      - name: Unir y homologar la región LATAM en un solo archivo XML
        run: |
          node -e '
            const fs = require("fs");
            let channels = new Set();
            
            const archivos = [
              "latam.xml"
            ];
            
            // 1. Inicializar archivo maestro XML
            fs.writeFileSync("guide.xml", "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<tv>\n");

            // 2. Extraer y escribir canales únicos
            archivos.forEach(file => {
              if (fs.existsSync(file)) {
                let content = fs.readFileSync(file, "utf8");
                let chanMatches = content.match(/<channel id=[\s\S]*?<\/channel>/g);
                if (chanMatches) {
                  chanMatches.forEach(c => channels.add(c));
                }
              }
            });

            for (let chan of channels) {
              fs.appendFileSync("guide.xml", chan + "\n");
            }

            // 3. Extraer y escribir programas secuencialmente (evita desborde de memoria)
            archivos.forEach(file => {
              if (fs.existsSync(file)) {
                console.log("Procesando programas de: " + file);
                let content = fs.readFileSync(file, "utf8");
                let progMatches = content.match(/<programme[\s\S]*?<\/programme>/g);
                if (progMatches) {
                  for (let i = 0; i < progMatches.length; i++) {
                    fs.appendFileSync("guide.xml", progMatches[i] + "\n");
                  }
                }
              }
            });

            // 4. Cerrar etiqueta principal
            fs.appendFileSync("guide.xml", "</tv>");
          '
          gzip -c guide.xml > epg-elgato.xml.gz
          rm -f guide.xml *.xml

      - name: Guardar y subir epg-elgato.xml.gz al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Bot] Actualización EPG unificado exclusivamente para LATAM"
          file_pattern: "epg-elgato.xml.gz"
