name: EPG Multiflujo Global Unificado

on:
  schedule:
    # Se ejecuta todos los días a la medianoche UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar tu repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clonar e instalar dependencias de IPTV-org EPG
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg-temp
          cd epg-temp
          npm install

      - name: Paso 1 - Descargar región LATAM (Hispana) y España
        run: |
          cd epg-temp
          npm run grab --- --sites=gatotv.com,mi.tv,movistarplus.es,orangetv.orange.es,programacion-tv.elpais.com,directv.com.ar,tv.movistar.co,tv.movistar.com.pe,directv.com.uy,anteltv.com.uy,energeek.cl,siba.com.co --output=latam.xml

      - name: Paso 2 - Descargar región USA y Canadá
        run: |
          cd epg-temp
          npm run grab --- --sites=tvguide.com,zap2it.com,directv.com,tvhebdo.com --output=usa.xml

      - name: Paso 3 - Descargar región UK
        run: |
          cd epg-temp
          npm run grab --- --sites=sky.com,freeview.co.uk,tv24.co.uk,mytelly.co.uk --output=uk.xml

      - name: Paso 4 - Unir, comprimir y generar epg-elgato.xml.gz
        run: |
          cd epg-temp
          # Instalamos la herramienta para combinar los archivos XMLTV
          npm install -g xmltv
          
          # Unimos los tres archivos XML generados en uno solo maestro llamado guide.xml
          xmltv combine -o guide.xml latam.xml usa.xml uk.xml
          
          # Lo movemos a la raíz del repositorio y lo comprimimos en .gz
          gzip -c guide.xml > ../epg-elgato.xml.gz

      - name: Subir cambios automáticamente al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Bot] Actualización automática de EPG unificado (limpio de Brasil)"
          file_pattern: "epg-elgato.xml.gz"
